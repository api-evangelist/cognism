components:
  schemas:
    ContactPreview:
      type: object
      description: Preview projection of a contact. `has*` booleans advertise which fields the full record carries. `redeemId` is the key for the Redeem API.
      properties:
        id:
          type: string
        redeemId:
          type: string
        fullName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        jobTitle:
          type: string
        account:
          $ref: '#/components/schemas/AccountPreview'
        hasEmail:
          type: boolean
        hasMobilePhoneNumbers:
          type: boolean
        hasDirectPhoneNumbers:
          type: boolean
        hasLinkedinUrl:
          type: boolean
        hasSkills:
          type: boolean
        hasEducation:
          type: boolean
        hasPreviousAccounts:
          type: boolean
        hasSeniority:
          type: boolean
        hasJobFunction:
          type: boolean
        hasManagementLevel:
          type: boolean
        hasPositionStartDate:
          type: boolean
        hasLastConfirmed:
          type: boolean
      additionalProperties: true
    Error:
      type: array
      description: Cognism returns errors as an array of error objects.
      items:
        type: object
        properties:
          key:
            type: string
            description: Machine-readable error key, e.g. MissingCredentials.
          code:
            type: integer
            description: HTTP status code, repeated in the body.
          msg:
            type: string
            description: Human-readable message.
    EnrichAccountResponse:
      type: object
      properties:
        matchScore:
          type: integer
          description: Default minimum is 40; anything under 35 is a low-quality match.
        results:
          type: array
          items:
            $ref: '#/components/schemas/AccountPreview'
    ContactEnrichRequest:
      type: object
      description: Identifiers for the contact to match. Supply a unique identifier (email, sha256 or linkedinUrl) or combine firstName + lastName with accountName / accountWebsite. Default minMatchScore is 30.
      properties:
        firstName:
          type: string
          description: Contact first name
        lastName:
          type: string
          description: Contact last name
        linkedinUrl:
          type: string
          description: Contact LinkedIn URL
        phoneNumber:
          type: string
          description: Contact Phone Number (searched any type of number)
        jobTitle:
          type: string
          description: Contact job title
        email:
          type: string
          description: Contact email
        sha256:
          type: string
          description: Contact email hash
        accountWebsite:
          type: string
          description: Account website
        accountName:
          type: string
          description: Account name
        anchorFields:
          type: array
          items:
            type: string
          description: Fields that must match
        minMatchScore:
          type: integer
          description: Minimum Match Score to return matched Account
      additionalProperties: false
    AccountEnrichRequest:
      type: object
      description: Identifiers for the account to match. Supply website, domain or linkedinUrl for the most accurate match. Default minMatchScore is 40.
      properties:
        linkedinUrl:
          type: string
          description: Account LinkedIn URL
        domain:
          type: string
          description: Account domain
        website:
          type: string
          description: Account website
        name:
          type: string
          description: Account name
        country:
          type: string
          description: Account country
        city:
          type: string
          description: Account city
        anchorFields:
          type: array
          items:
            type: string
          description: Fields that must match
        minMatchScore:
          type: integer
          description: Minimum Match Score to return matched Account
      additionalProperties: false
    AccountPreview:
      type: object
      description: Preview projection of an account. `has*` booleans advertise which fields the full record carries; the values themselves arrive from the Redeem API.
      properties:
        id:
          type: string
        name:
          type: string
        hasDomain:
          type: boolean
        hasIndustries:
          type: boolean
        hasDescription:
          type: boolean
        hasShortDescription:
          type: boolean
        hasFounded:
          type: boolean
        hasWebsite:
          type: boolean
        hasLinkedinUrl:
          type: boolean
        hasRevenue:
          type: boolean
        hasSic:
          type: boolean
        hasIsic:
          type: boolean
        hasNaics:
          type: boolean
        hasHeadcount:
          type: boolean
        hasSize:
          type: boolean
        hasTechnologies:
          type: boolean
        hasType:
          type: boolean
        hasLocation:
          type: boolean
        hasOfficePhoneNumbers:
          type: boolean
        hasHqPhoneNumbers:
          type: boolean
        hasHiringEvent:
          type: boolean
      additionalProperties: true
    EnrichContactResponse:
      type: object
      properties:
        matchScore:
          type: integer
          description: How closely the submitted identifiers matched. Default minimum is 30; anything under 27 is a low-quality match.
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContactPreview'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token issued in the Cognism app under Settings > Tokens and API. Sent as `Authorization: Bearer <token>`. Tokens have a time-to-live of 6 months.'
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: Alternative to the Authorization header. Cognism documents it but recommends the header instead, as the query string is less secure.
