                  description: Search contacts with account having highPlus quality HQ phone numbers
            hiringEvent:
              type: object
              properties:
                eventDateFrom:
                  type: integer
                  description: Contact's current account hiring event date range from (Unix timestamp
                    in milliseconds)
                eventDateTo:
                  type: integer
