components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API token issued in the Cognism app under Settings > Tokens and API. Sent as `Authorization:
        Bearer <token>`. Tokens have a time-to-live of 6 months.'
    apiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: Alternative to the Authorization header. Cognism documents it but recommends the header
        instead, as the query string is less secure.
  schemas:
    ContactSearchRequest:
      type: object
      description: Filter set for the Search API contact endpoint. Every field is optional; filters combine
        with AND unless the field documents otherwise.
      properties:
        ids:
          type: array
          items:
            type: string
          description: Contact ids. Can be either ids or redeemIds. Mix of ids and redeem ids in the single
            request is not supported
        excludeIds:
          type: array
          items:
            type: string
          description: Exclude contact ids. Can be either ids or redeemIds. Mix of ids and redeem ids
            in the single request is not supported
        fullName:
          type: string
          description: Contact name
        firstName:
          type: string
          description: Contact first name
        lastName:
          type: string
          description: Contact last name
        jobTitles:
          type: array
          items:
            type: string
          description: Contact current position job titles
        excludeJobTitles:
          type: array
          items:
            type: string
          description: Contact current position excluded job titles
        seniority:
          type: array
          items:
            type: string
            enum:
            - Manager
            - Director
            - Partner
            - CXO
            - Owner
            - VP
          description: 'Contact current position seniority. Allowed values: Manager, Director, Partner,
            CXO, Owner, VP'
        jobFunctions:
          type: array
          items:
            type: string
            enum:
            - Oversight
            - Technology
            - Operations
            - Sales
            - Marketing
            - Client Success
            - HR
            - Accounting
            - Business
            - Production
          description: 'Contact current position job functions. Allowed values: Oversight, Technology,
            Operations, Sales, Marketing, Client Success, HR, Accounting, Business, Production'
        managementLevel:
          type: array
          items:
            type: string
            enum:
            - Entry-Level
            - Team-Lead
            - Experienced Staff
            - Executive-Level
            - Senior Leadership
            - Middle-Management
            - CxO
          description: 'Contact current position management levels. Allowed values: Entry-Level, Team-Lead,
            Experienced Staff, Executive-Level, Senior Leadership, Middle-Management, CxO'
        regions:
          type: array
          items:
            type: string
          description: Contact location world regions. Check allowed values Regions
        countries:
          type: array
          items:
            type: string
          description: Contact location countries. Check allowed values Countries
        excludeCountries:
          type: array
          items:
            type: string
          description: Contact location excluded countries. Check allowed values Countries
        states:
          type: array
          items:
            type: string
          description: Contact location states. Check allowed values States
        excludeStates:
          type: array
          items:
            type: string
          description: Contact location excluded states. Check allowed values States
        cities:
          type: array
          items:
            type: string
          description: Contact location cities
        excludeCities:
          type: array
          items:
            type: string
          description: Contact location excluded cities
        zip:
          type: array
          items:
            type: string
          description: Contact location zip codes
        locations:
          type: array
          items:
            type: object
            properties:
              country:
                type: string
                description: Contact location country
              city:
                type: string
                description: Contact location city
              state:
                type: string
                description: Contact location state
              zip:
                type: string
                description: Contact location ZIP or postal code
          description: Array of object containing country, city, state and zip codes. OR logic is applied
            between objects
        skills:
          type: array
          items:
            type: string
          description: Contact skills. Check allowed values Skills
        excludeSkills:
          type: array
          items:
            type: string
          description: Contact excluded skills. Check allowed values Skills
        linkedinUrl:
          type: string
          description: Contact LinkedIn URL
        education:
          type: object
          properties:
            schools:
              type: array
              items:
                type: string
              description: Contact education school name
            degrees:
              type: array
              items:
                type: string
              description: Contact education degree name
        mobilePhoneNumbers:
          type: object
          properties:
            medium:
              type: boolean
              description: Search contacts with medium quality mobile phone numbers
            high:
              type: boolean
              description: Search contacts with high quality mobile phone numbers
            highPlus:
              type: boolean
              description: Search contacts with highPlus quality mobile phone numbers
        directPhoneNumbers:
          type: object
          properties:
            medium:
              type: boolean
              description: Search contacts with medium quality direct phone numbers
            high:
              type: boolean
              description: Search contacts with high quality direct phone numbers
            highPlus:
              type: boolean
              description: Search contacts with highPlus quality direct phone numbers
        emailQuality:
          type: object
          properties:
            medium:
              type: boolean
              description: Search contacts with medium quality email
            high:
              type: boolean
              description: Search contacts with high quality email
            highPlus:
              type: boolean
              description: Search contacts with highPlus quality email
        sha256:
          type: array
          items:
            type: string
          description: Search contacts by sha256 hashed email
        lastConfirmed:
          type: object
          properties:
            from:
              type: integer
              description: Contact profile time updated range from. (Unix timestamp in milliseconds)
            to:
              type: integer
              description: Contact profile time updated range to. (Unix timestamp in milliseconds)
        account:
          type: object
          properties:
            ids:
              type: array
              items:
                type: string
              description: Contact's current account ids.
            excludeIds:
              type: array
              items:
                type: string
              description: Contact's current account exclude ids.
            names:
              type: array
              items:
                type: string
              description: Contact's current account names
            excludeNames:
              type: array
              items:
                type: string
              description: Contact's current account exclude names
            domains:
              type: array
              items:
                type: string
              description: Contact's current account domains
            excludeDomains:
              type: array
              items:
                type: string
              description: Contact's current account exclude domains
            websites:
              type: array
              items:
                type: string
              description: Contact's current account websites
            description:
              type: string
              description: Contact's current account description (keyword)
            excludeDescription:
              type: string
              description: Contact's current account excluded description (keyword)
            shortDescription:
              type: string
              description: Contact's current account short description (keyword)
            keywords:
              type: array
              items:
                type: string
              description: Contact's current account keywords
            revenue:
              type: object
              properties:
                from:
                  type: integer
                  description: Contact's current account revenue range from
                to:
                  type: integer
                  description: Contact's current account revenue range to
            founded:
              type: object
              properties:
                from:
                  type: integer
                  description: Contact's current account founded year range from
                fo:
                  type: integer
                  description: Contact's current account founded year range to
            types:
              type: array
              items:
                type: string
                enum:
                - Public Company
                - Educational
                - Educational Institution
                - Government Agency
                - Partnership
                - Privately Held
                - Self-Employed
                - non profit
              description: 'Contact''s current account type. Allowed values: Public Company , Educational
                , Educational Institution , Government Agency , Partnership , Privately Held , Self-Employed
                , non profit'
            regions:
              type: array
              items:
                type: string
              description: Contact's current account world regions. Check allowed values Regions
            countries:
              type: array
              items:
                type: string
              description: Contact's current account countries. Check allowed values Countries
            excludeCountries:
              type: array
              items:
                type: string
              description: Contact's current account excluded countries. Check allowed values Countries
            states:
              type: array
              items:
                type: string
              description: Contact's current account states. Check allowed values States
            excludeStates:
              type: array
              items:
                type: string
              description: Contact's current account excluded states. Check allowed values States
            cities:
              type: array
              items:
                type: string
              description: Contact's current account cities
            excludeCities:
              type: array
              items:
                type: string
              description: Contact's current account excluded cities
            zip:
              type: array
              items:
                type: string
              description: Contact's current account zip codes
            locations:
              type: array
              items:
                type: object
                properties:
                  country:
                    type: string
                    description: Account location country
                  city:
                    type: string
                    description: Account location city
                  state:
                    type: string
                    description: Account location state
                  zip:
                    type: string
                    description: Account zip or postal code
              description: Array of object containing country, city, state and zip codes. OR logic is
                applied between objects
            industries:
              type: array
              items:
                type: string
              description: Contact current account industries. Check allowed values Industries
            excludeIndustries:
              type: array
              items:
                type: string
              description: Contact's current account excluded industries. Check allowed values Industries
            sic:
              type: array
              items:
                type: string
              description: Contact's current account SIC codes. Check allowed values SIC Codes
            isic:
              type: array
              items:
                type: string
              description: Contact's current account ISIC codes. Check allowed values ISIC Codes
            naics:
              type: array
              items:
                type: string
              description: Contact's current account NAICS codes. Check allowed values NAICS Codes
            headcount:
              type: object
              properties:
                from:
                  type: integer
                  description: Contact's current account headcount minimum
                to:
                  type: integer
                  description: Contact's current account headcount maximum
            technologies:
              type: array
              items:
                type: string
              description: Contact's current account technologies used. Check allowed values Technologies
            excludedTechnologies:
              type: array
              items:
                type: string
              description: Contact's current account exclude technologies used. Check allowed values Technologies
            lastConfirmed:
              type: object
              properties:
                from:
                  type: integer
                  description: Contact's current account time updated range from. (Unix timestamp in milliseconds)
                to:
                  type: integer
                  description: Contact's current account time updated range to. (Unix timestamp in milliseconds)
            hqPhoneNumbers:
              type: object
              properties:
                medium:
                  type: boolean
                  description: Search contacts with account having medium quality HQ phone numbers
                high:
                  type: boolean
                  description: Search contacts with account having high quality HQ phone numbers
                highPlus:
                  type: boolean
                  description: Search contacts with account having highPlus quality HQ phone numbers
            officePhoneNumbers:
              type: object
              properties:
                medium:
                  type: boolean
                  description: Search contacts with account having medium quality office phone numbers
                high:
                  type: boolean
                  description: Search contacts with account having high quality HQ phone numbers
                highPlus:
