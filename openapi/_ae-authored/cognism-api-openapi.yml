                  - R&D
                  - customer
                  - operations
                  - finance
                  description: 'Contact''s current account hiring event hiring department. Allowed values:
                    legal, it, administration, marketing, sales, R&D, customer, operations, finance'
                country:
                  type: array
                  items:
                    type: string
                  description: Contact's current account hiring event job place countries
                state:
                  type: array
                  items:
                    type: string
                  description: Contact's current account hiring event job place states
                city:
                  type: array
                  items:
                    type: string
