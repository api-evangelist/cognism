description: >-
  Cognism ships NO Model Context Protocol server of its own. Searched the Cognism developer portal,
  help centre, GitHub organisation, npm (`@modelcontextprotocol` scope and text search) and the
  public MCP registries; nothing first-party exists, and mcp.cognism.com does not resolve. Third
  parties (Zapier MCP, viaSocket) wrap "Cognism Prospector" as an MCP surface, but those are the
  integrators' servers running against their own Cognism connectors, not a Cognism agent surface —
  they are recorded below as third_party and deliberately NOT treated as a provider deployment.
  The tools[] list below is a CANDIDATE derived one-to-one from the OpenAPI operations. It is what a
  Cognism MCP server would plausibly expose; it is not something an agent can call today.

deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: derived
  note: >-
    mode:none — nobody ships a server. If Cognism were to ship one, auth would be the same bearer API
    token the REST API uses (Settings > Tokens and API in the Cognism app, 6-month TTL).

