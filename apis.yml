  - https://developers.cognism.com/
  note: >-
    Documentation is fully public — the developer portal, the complete API reference and the help
    centre are all readable without an account. Access is not. API use requires the subscription to
    include API access (the Data-as-a-Service product, which itself requires a prospecting seat),
    field-level Entitlements provisioned by the Cognism team after Account Manager approval, and a
    token minted in the app. No prices, no free tier, no trial and no self-serve signup are published.
  generated: '2026-08-13'
