aid: cognism
url: https://raw.githubusercontent.com/api-evangelist/cognism/refs/heads/main/apis.yml
name: Cognism
kind: company
description: >-
  Cognism is a B2B sales intelligence platform selling verified emails, mobile
  numbers, direct dials, firmographic and technographic data, buying-intent signals and
  contact enrichment to sales, marketing and RevOps teams, with a compliance-first posture
  built around GDPR and CCPA. Its API is a three-service REST contract published as a Postman
  collection at developers.cognism.com — a Search API for finding contacts and companies by
  filter, an Enrich API for matching records you already hold, and a Redeem API for exchanging
  the resulting redeem ID for the full profile. Search and Enrich return preview records and
  cost nothing; credits are consumed only when a contact is redeemed for the first time. A
  Compliance API exposes the opt-out suppression list, and an Entitlement API reports which
  fields the account is licensed to receive. API access is sales-gated: it must be enabled on
  the subscription, field-level entitlements provisioned by Cognism, and a six-month bearer
  token generated in the application.
