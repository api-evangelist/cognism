# DELIBERATE ABSENCES — recorded so a later round does not "fix" them by inventing a pointer:
#   no SDKs        — packages/cognism-packages.yml found zero first-party client libraries
#                    across eight registries and the GitHub org.
#   no Idempotency — conventions/cognism-conventions.yml records idempotency.supported: false.
#                    Cognism publishes no idempotency key or replay contract.
#   no WellKnown / SecurityTxt — well-known/cognism-well-known.yml is a 32-path probe that
#                    returned zero documents on all four hosts.
#   no StatusPage  — cognism.statuspage.io answers 200 with "Page Inactive … team members only"
#                    and status.cognism.com returns 500. A soft 200 is not a status page.
#   no Deprecation — no deprecation or sunset policy is published.
#   no AgentCard   — /.well-known/agent-card.json and /.well-known/agent.json miss on every host.
#   no MCPServer   — no first-party MCP server exists; only third-party Zapier/viaSocket wrappers.
#   no AsyncAPI / Webhooks — Cognism ships no event, webhook or streaming surface at all.
#   no GraphQL     — the previous "conceptual" GraphQL schema in graphql/ was a fabrication and
#                    has been removed; Cognism publishes no GraphQL API.
#   no ChangeLog / CLI / Sandbox / Components — none published.
